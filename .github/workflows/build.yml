name: Certus Kernel Build (Dual Toolchain)

on:
  workflow_dispatch:

env:
  TZ: Europe/Moscow
  DEVICE: Certus
  DEFCONFIG: certus_defconfig
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
          git zip curl libncurses5-dev libncurses5

      - name: Download Linaro GCC (64-bit & 32-bit)
        run: |
          # Скачиваем основной 64-битный тулчейн
          git clone --depth=1 https://github.com/Linaro/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git tc64
          # Скачиваем вспомогательный 32-битный тулчейн
          git clone --depth=1 https://github.com/Linaro/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.git tc32
          
          # Сохраняем пути для использования в шаге сборки
          echo "CC64=$(pwd)/tc64/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC32=$(pwd)/tc32/bin/arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          # Функция отправки сообщений
          send_msg() {
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" -d text="$1"
          }

          START=$(date +"%s")
          send_msg "🚀 <b>Сборка $DEVICE запущена!</b>%0A📦 <i>Используются GCC 7.5 (64/32-bit)</i>"

          # Настройка переменных окружения
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=${{ env.CC64 }}
          export CROSS_COMPILE_ARM32=${{ env.CC32 }} # Тот самый тулчейн для арм32
          
          mkdir -p out
          make O=out $DEFCONFIG
          
          # Запуск компиляции
          if make -j$(nproc --all) O=out 2>&1 | tee build.log; then
            END=$(date +"%s")
            DIFF=$((END - START))
            K_VER=$(make O=out kernelversion)
            
            MSG="✅ <b>Ядро собрано успешно!</b>%0A%0A"
            MSG+="📋 <b>Версия:</b> $K_VER%0A"
            MSG+="⏳ <b>Время:</b> $((DIFF / 60))м $((DIFF % 60))с"
            
            send_msg "$MSG"
            
            # Отправка лога
            curl -F chat_id="${CHAT_ID}" -F document=@"build.log" -F caption="Лог сборки" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            
            # Поиск и отправка результата
            FILES=("out/arch/arm64/boot/Image.gz-dtb" "out/arch/arm64/boot/Image.gz" "out/arch/arm64/boot/Image")
            for FILE in "${FILES[@]}"; do
              if [ -f "$FILE" ]; then
                curl -F chat_id="${CHAT_ID}" -F document=@"$FILE" -F caption="Образ ядра: $(basename $FILE)" "https://api.telegram.org/bot${TOKEN}/sendDocument"
                break
              fi
            done
          else
            send_msg "❌ <b>Ошибка сборки!</b> Проверь лог ниже."
            curl -F chat_id="${CHAT_ID}" -F document=@"build.log" -F caption="Лог ошибок" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            exit 1
          fi
